name: Discord notification contracts
on:
  pull_request:
    branches: [dev-master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev-master]
    paths: ['tools/github/**', 'changelogs/**', '.github/workflows/issue-discord*.yml', '.github/workflows/changelog-*.yml', '.github/pull_request_template.md']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - shell: pwsh
        run: |
          & (Get-Command node -CommandType Application | Select-Object -First 1).Source --test tools/github/issue-discord.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-Command node -CommandType Application | Select-Object -First 1).Source --test tools/github/changelog-discord.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-Command node -CommandType Application | Select-Object -First 1).Source --test tools/github/pr-changelog.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-Command node -CommandType Application | Select-Object -First 1).Source tools/github/changelog-discord.mjs --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate PR changelog description
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          & (Get-Command node -CommandType Application | Select-Object -First 1).Source tools/github/pr-changelog.mjs --check-pr

