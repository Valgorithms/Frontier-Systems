name: Production recipe observation contracts

on:
  pull_request:
    branches: [dev-master]
    paths:
      - 'src/core/production/**'
      - 'src/core/pressure/**'
      - 'src/core/access/prepared_door_change.gd'
      - 'src/core/runtime/world_runtime.gd'
      - 'docs/schema/pressure-system*'
      - 'docs/schema/world-snapshot*'
      - 'src/adapters/network/**'
      - 'src/presentation/production/**'
      - 'docs/schema/production*'
      - 'docs/schema/door-contact*'
      - 'docs/schema/paid-door*'
      - 'tests/godot/paid_door*'
      - 'tests/godot/finite_bootstrap*'
      - 'tests/schema/finite_bootstrap*'
      - 'data/production/catalog.v2.json'
      - 'tests/schema/paid_door*'
      - 'tests/godot/recipe_requirements*'
      - 'tests/godot/timed_canister_controls*'
      - 'tests/godot/workstation_resource_view*'
      - 'tests/schema/recipe_requirements*'
      - 'tests/schema/timed_canister_controls*'
      - 'tests/schema/paid_horizontal_panels*'
      - 'tests/godot/paid_horizontal_panels*'
      - 'tests/godot/horizontal_panel_controls*'
      - 'tests/schema/horizontal_panel_controls*'
      - 'docs/schema/horizontal-panel-observation*'
      - 'src/core/locomotion/horizontal_floor_support_query*'
      - 'tests/godot/horizontal_floor_support_query*'
      - 'tests/schema/horizontal_floor_support*'
      - 'docs/schema/horizontal-floor-support*'
      - 'src/core/inventory/inventory_simulation_system.gd'
      - 'src/core/locomotion/paid_floor_support_adapter*'
      - 'tests/godot/paid_floor_support_adapter*'
      - 'tests/schema/paid_floor_locomotion*'
      - 'docs/schema/paid-floor-locomotion*'
      - 'tests/godot/paid_panel_collision_descriptors*'
      - 'tests/schema/paid_panel_collision*'
      - 'tests/godot/paid_panel_contact_scene*'
      - 'tests/schema/paid_panel_contact*'
      - 'docs/schema/paid-panel-contact*'
      - 'tests/support/paid_panel_contact_fixture.gd'
      - 'docs/schema/paid-panel-collision*'
      - 'docs/schema/timed-canister-observation*'
      - '.github/workflows/production-recipe-observations.yml'
  push:
    branches: [codex/recipe-observations]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-recipe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Production recipes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Run bounded recipe, resource and maintenance checks
        shell: pwsh
        run: ./tools/ci/run-godot-checks.ps1 -TestNames 'recipe_requirements_test.gd','workstation_resource_view_test.gd','repair_usability_test.gd','first_playable_task_guide_test.gd','machinery_runtime_test.gd','checkpoint_recovery_test.gd','timed_canister_controls_test.gd','paid_horizontal_panels_test.gd','paid_door_lifecycle_test.gd','paid_door_pressure_room_test.gd','finite_bootstrap_acquisition_test.gd','horizontal_panel_controls_test.gd','horizontal_floor_support_query_test.gd','paid_floor_support_adapter_test.gd','paid_panel_collision_descriptors_test.gd','paid_panel_contact_scene_test.gd'
      - name: Validate real emitted JSON against local versioned schemas
        shell: pwsh
        run: |
          $schemaPython = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          & $schemaPython --version
          if ($LASTEXITCODE -ne 0) { throw 'A working hosted Python runtime is required.' }
          & $schemaPython -m pip install --disable-pip-version-check --target var/ci/schema-python jsonschema==4.23.0
          if ($LASTEXITCODE -ne 0) { throw 'Schema development dependencies failed.' }
          $env:PYTHONPATH = [IO.Path]::GetFullPath('var/ci/schema-python')
          & $schemaPython tests/schema/recipe_requirements_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Recipe requirement schema checks failed.' }
          & $schemaPython tests/schema/timed_canister_controls_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Timed canister schema checks failed.' }
          & $schemaPython tests/schema/finite_bootstrap_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Finite bootstrap schema checks failed.' }
          & $schemaPython tests/schema/paid_door_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Paid door schema checks failed.' }
          & $schemaPython tests/schema/paid_door_pressure_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Paid pressure-room schema checks failed.' }
          & $schemaPython tests/schema/paid_horizontal_panels_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Paid panel schema checks failed.' }
          & $schemaPython tests/schema/horizontal_panel_controls_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Panel controls schema checks failed.' }
          & $schemaPython tests/schema/horizontal_floor_support_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Floor support schema checks failed.' }
          & $schemaPython tests/schema/paid_floor_locomotion_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Paid floor locomotion schema checks failed.' }
          & $schemaPython tests/schema/paid_panel_collision_schema_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $schemaPython tests/schema/paid_panel_contact_schema_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Paid panel collision schema checks failed.' }
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-recipe-${{ matrix.os }}
          path: |
            var/ci/godot/
            var/recipe-requirements-fixture.json
            var/finite-bootstrap-fixture.json
            var/timed-canister-controls-fixture.json
            var/paid-panels-fixture.json
            var/paid-door-fixture.json
            var/paid-door-pressure-fixture.json
            var/horizontal-panel-controls-fixture.json
            var/horizontal-floor-support-fixture.json
            var/paid-floor-locomotion-fixture.json
            var/paid-panel-collision-fixture.json
          retention-days: 3
          if-no-files-found: warn
